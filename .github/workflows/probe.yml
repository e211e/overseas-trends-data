name: hot
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch all boards
        run: python build/fetch_hot.py
      - name: commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "hot: update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
